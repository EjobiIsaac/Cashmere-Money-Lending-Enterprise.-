name: Build CASHMERE EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller Pillow
      - run: python -c "from PIL import Image; Image.open('icon.png').save('icon.ico')"
      - run: pyinstaller --onefile --windowed --name "CASHMERE-Money-Lending" --icon=icon.ico app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CASHMERE-EXE
          path: dist/*.exe
